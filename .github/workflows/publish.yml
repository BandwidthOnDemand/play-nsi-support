# Publishes the library to GitHub Packages when a release is created.

name: Publish to Github maven repository

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Install sbt
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1

    - name: Publish to GitHub Packages
      run: sbt publish
      env:
        GITHUB_TOKEN: ${{ github.token }}
