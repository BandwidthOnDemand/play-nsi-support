# Publishes the library to GitHub Packages when a release is created.

name: Publish to Github maven repository

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Install sbt
      uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1

    - name: Publish to GitHub Packages
      run: sbt publish
      env:
        GITHUB_TOKEN: ${{ github.token }}
