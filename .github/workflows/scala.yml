# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Start PostgreSQL
      run: sudo systemctl start postgresql.service
    - name: Initialize PostgreSQL database
      run: |
        sudo -u postgres psql -c "CREATE USER \"play-nsi-support-user\" PASSWORD 'password'"
        sudo -u postgres createdb -O play-nsi-support-user play-nsi-support-test
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Install sbt
      uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1
    - name: Run tests
      run: sbt test
    - name: Check code formatting
      run: sbt scalafmtCheckAll scalafmtSbtCheck
